<body>
<div class="app">
  <div id="sidebarOverlay" class="sidebar-overlay"></div>
  <aside id="sidebar">
    <div class="brand"><span class="brand-icon">↗</span><div><div class="brand-name">فلوسي</div><div class="brand-sub">إدارة مالية شخصية ذكية</div></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="aside-bottom"><div>✦ <b>هدفك: بناء الثروة</b></div><p>ابدأ بصندوق طوارئ ثم استثمر بانتظام وفق خطتك المالية.</p></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="top-right"><button class="mini-btn mobile-only" data-action="toggleNav" aria-label="القائمة">☰</button><div><h1 id="viewTitle">لوحة التحكم</h1><small id="connectionText">جارٍ تحميل البيانات...</small></div></div>
      <div class="top-actions"><input type="month" id="monthSelector" class="month" aria-label="اختر الشهر"><button class="mini-btn" data-action="refresh" title="تحديث">⟳</button><button class="primary" data-action="newTx" data-type="مصروف">＋ إضافة عملية</button></div>
    </header>
    <div id="previewNotice"></div>
    <div id="content"></div>
    <button class="primary mobile-only bottom-add" data-action="newTx" data-type="مصروف" aria-label="إضافة عملية">＋</button>
  </main>
</div>
<div class="modal-backdrop" id="modalBackdrop"><div id="modal" class="modal" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" role="status"></div>
<script>
(()=>{'use strict';
const SHEET_URL='https://docs.google.com/spreadsheets/d/1cB5FB-fqn8GMdXRE-wRrS0Fk5jt4FQk2J18UlNU6_No/edit';
const LIVE=typeof google!=='undefined' && !!google.script && !!google.script.run;
const LOCAL_KEY='flosy-finance-local-v2';
const NAV=[['overview','◫','لوحة التحكم'],['transactions','⇄','المعاملات'],['budget','◉','الميزانية'],['goals','◎','الأهداف المالية'],['investments','↗','الاستثمار'],['bills','▦','الفواتير'],['reports','▤','التقارير'],['settings','⚙','الإعدادات']];
const CAT=['إيجار','فواتير','طعام','مواصلات','تسوق','صحة','ترفيه','تعليم','اشتراكات','أخرى'];
const TYPES=['مصروف','دخل','طوارئ','استثمار','احتياطي','سحب طوارئ','سحب استثمار','سحب احتياطي'];
const DEFAULT={settings:{'المرتب الشهري':17000,'الإيجار':2500,'الفواتير':500,'المعيشة':6000,'الطوارئ المستهدفة':54000,'مصاريف غير منتظمة':1000,'رصيد الطوارئ الافتتاحي':0,'رصيد الاستثمار الافتتاحي':0,'رصيد الاحتياطي الافتتاحي':0},transactions:[],goals:[],bills:[],valuations:[],plan:[],serverDate:new Date().toISOString().slice(0,10),connected:false};
let state=JSON.parse(JSON.stringify(DEFAULT)),view='overview',month='',search='',filter='الكل',loading=false;
const $=id=>document.getElementById(id),escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>Number(v)||0,fmt=v=>new Intl.NumberFormat('ar-EG',{maximumFractionDigits:0}).format(num(v)),money=v=>fmt(v)+' ج.م',pct=v=>Math.round(v*100)+'%',clamp=v=>Math.max(0,Math.min(1,Number.isFinite(v)?v:0));
const cfg=k=>num(state.settings[k]);const iso=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const monthTx=()=>state.transactions.filter(x=>String(x.date).startsWith(month));
const sum=(arr,type)=>arr.filter(x=>x.type===type).reduce((a,x)=>a+num(x.amount),0);
const bucket=x=>x.category==='إيجار'?'إيجار':x.category==='فواتير'?'فواتير':'المعيشة';
const getStats=()=>{const tx=monthTx(),income=sum(tx,'دخل'),expense=sum(tx,'مصروف'),budget=cfg('الإيجار')+cfg('الفواتير')+cfg('المعيشة');const all=state.transactions;const emergency=cfg('رصيد الطوارئ الافتتاحي')+sum(all,'طوارئ')-sum(all,'سحب طوارئ');const investment=cfg('رصيد الاستثمار الافتتاحي')+sum(all,'استثمار')-sum(all,'سحب استثمار');const reserve=cfg('رصيد الاحتياطي الافتتاحي')+sum(all,'احتياطي')-sum(all,'سحب احتياطي');const latest=state.valuations.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];return {income,expense,budget,net:income-expense,emergency,investment,reserve,portfolio:latest?num(latest.value):investment,hasValuation:!!latest};};
function toast(message,err=false){const t=$('toast');t.textContent=message;t.className='toast show'+(err?' error':'');clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>t.classList.remove('show'),4100)}
function getLocal(){try{const d=JSON.parse(localStorage.getItem(LOCAL_KEY)||'null');return d?{...structuredClone(DEFAULT),...d,settings:{...DEFAULT.settings,...d.settings}}:structuredClone(DEFAULT)}catch{return structuredClone(DEFAULT)}}
function saveLocal(){localStorage.setItem(LOCAL_KEY,JSON.stringify(state))}
function call(method,arg){if(LIVE)return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[method](arg));
  let obj=arg||{};let next=structuredClone(state);const id=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());
  if(method==='addTransaction')next.transactions.push({...obj,id:id()});
  if(method==='deleteTransaction')next.transactions=next.transactions.filter(x=>x.id!==arg);
  if(method==='saveSettings')next.settings={...next.settings,...obj};
  if(method==='saveGoal'||method==='saveBill'){let key=method==='saveGoal'?'goals':'bills';const i=next[key].findIndex(x=>x.id===obj.id);if(i<0)next[key].push({...obj,id:id()});else next[key][i]={...obj};}
  if(method==='deleteGoal'||method==='deleteBill'){let key=method==='deleteGoal'?'goals':'bills';next[key]=next[key].filter(x=>x.id!==arg)}
  if(method==='saveValuation')next.valuations.push(obj);
  if(method==='getData')return Promise.resolve(getLocal());
  state=next;saveLocal();return Promise.resolve(structuredClone(state));
}
async function refresh(){if(loading)return;loading=true;$('connectionText').textContent='جارٍ مزامنة البيانات…';try{state=await call('getData');$('connectionText').textContent=LIVE?'● متصل بقاعدة بيانات Google Sheets':'● وضع محلي — غير متصل بجوجل شيت';render();}catch(e){toast('تعذّر تحميل البيانات: '+(e.message||e),true);$('connectionText').textContent='تعذّر الاتصال';}finally{loading=false}}
async function mutate(method,arg){try{$('connectionText').textContent='جارٍ الحفظ…';const data=await call(method,arg);state=data;closeModal();render();toast('✓ تم الحفظ بنجاح');$('connectionText').textContent=LIVE?'● تم الحفظ في Google Sheets':'● تم الحفظ محليًا في هذا المتصفح'}catch(e){toast('فشل الحفظ: '+(e.message||e),true)}finally{const b=$('modalSave');if(b)b.disabled=false}}
function renderNav(){$('nav').innerHTML=NAV.map(([v,icon,title])=>`<button class="${view===v?'active':''}" data-action="navigate" data-view="${v}"><span class="symbol">${icon}</span>${title}</button>`).join('')}
function pageTitle(){return NAV.find(([v])=>v===view)?.[2]||'لوحة التحكم'}
function render(){renderNav();$('viewTitle').textContent=pageTitle();$('monthSelector').value=month;$('previewNotice').innerHTML=LIVE?'':`<div class="notice">وضع تجربة محلي: البيانات المحفوظة هنا داخل هذا المتصفح فقط، ولا تُزامن إلى Google Sheets. عند نشر التطبيق عبر Apps Script ستُفعّل المزامنة الفعلية. <button class="outline" data-action="export" style="margin-right:8px;padding:3px 10px">تصدير نسخة احتياطية</button></div>`;
const views={overview:renderOverview,transactions:renderTransactions,budget:renderBudget,goals:renderGoals,investments:renderInvestments,bills:renderBills,reports:renderReports,settings:renderSettings};$('content').innerHTML=(views[view]||renderOverview)();}
const panel=(title,content,extra='')=>`<section class="panel"><div class="head"><h3>${title}</h3>${extra}</div>${content}</section>`;
const progress=(label,used,total,color='')=>`<div class="progress-item"><div class="flex-between"><span>${label}</span><b>${money(used)} <span class="muted small">/ ${money(total)}</span></b></div><div class="bar ${used>total?'warning':''}" style="margin:8px 0 4px"><span style="width:${pct(clamp(used/Math.max(total,1)))};${color?'background:'+color:''}"></span></div><div class="muted small">${Math.round(used/Math.max(total,1)*100)}% من الهدف</div></div>`;
function expensesByBucket(){const out={'إيجار':0,'فواتير':0,'المعيشة':0};monthTx().filter(x=>x.type==='مصروف').forEach(x=>out[bucket(x)]+=num(x.amount));return out}
function monthName(m){try{return new Date(m+'-01T12:00:00').toLocaleDateString('ar-EG',{month:'short'})}catch{return m}}
function lastMonths(n){const [y,m]=month.split('-').map(Number),out=[];for(let i=n-1;i>=0;i--){const d=new Date(y,m-1-i,1);out.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'))}return out}
function svgTrend(){const ms=lastMonths(6),series=ms.map(m=>{const rows=state.transactions.filter(x=>x.date.startsWith(m));return {month:m,income:sum(rows,'دخل'),expense:sum(rows,'مصروف')}});const max=Math.max(...series.flatMap(x=>[x.income,x.expense]),cfg('المرتب الشهري'),1),W=670,H=205,pad=25,barW=26,gap=8;let inner=Array.from({length:4},(_,i)=>`<line x1="5" x2="${W-5}" y1="${25+i*46}" y2="${25+i*46}" stroke="#2c465a" stroke-dasharray="3 5"/>`).join('');series.forEach((d,i)=>{const x=(W-40)*(i+.5)/6+12;const h1=(d.income/max)*160,h2=(d.expense/max)*160;inner+=`<rect x="${x-20}" y="${H-h1}" width="${barW}" height="${h1}" rx="5" fill="#20dcc0"/><rect x="${x+9}" y="${H-h2}" width="${barW}" height="${h2}" rx="5" fill="#508cff"/>`});return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="مقارنة الدخل بالمصروفات خلال ستة أشهر">${inner}</svg><div class="chart-labels">${series.map(x=>`<span>${monthName(x.month)}</span>`).join('')}</div><div class="flex-between" style="justify-content:center;gap:24px;margin-top:14px"><div class="legend"><i class="dot"></i> الدخل</div><div class="legend"><i class="dot" style="background:var(--blue)"></i> المصروفات</div></div>`}
function distribution(){const cats=Object.entries(expensesByBucket());const total=cats.reduce((a,[,v])=>a+v,0),colors=['#16dcc0','#4d93ff','#9772fa'];let stops=[],pos=0;cats.forEach(([,v],i)=>{let end=pos+(total?v/total*100:0);stops.push(`${colors[i]} ${pos}% ${end}%`);pos=end});return `<div class="ring-wrap"><div class="donut" style="background:${total?'conic-gradient('+stops.join(',')+')':'conic-gradient(#294358 0 100%)'}"><div class="donut-center"><b>${money(total)}</b><small>إجمالي الإنفاق</small></div></div><div class="ring-legend">${cats.map(([k,v],i)=>`<div><span class="legend"><i class="dot" style="background:${colors[i]}"></i>${k}</span><b>${money(v)}</b></div>`).join('')}</div></div>`}
function recentTable(limit=6,full=false){const rows=monthTx().filter(t=>filter==='الكل'||t.type===filter).filter(t=>(t.description+' '+t.category+' '+t.notes).includes(search)).slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,limit);if(!rows.length)return `<div class="empty">لا توجد عمليات مسجلة في هذا الشهر. ابدأ بإضافة أول عملية.</div>`;return `<div class="table-scroll"><table class="table"><thead><tr><th>التاريخ</th><th>الوصف</th><th>النوع</th><th>الفئة</th><th>المبلغ</th>${full?'<th></th>':''}</tr></thead><tbody>${rows.map(t=>`<tr><td>${escape(t.date)}</td><td><span class="tx-name">${escape(t.description||'بدون وصف')}</span></td><td><span class="tag ${t.type==='مصروف'?'exp':''}">${escape(t.type)}</span></td><td>${escape(t.category)}</td><td class="${t.type==='مصروف'?'expense-color':'income-color'}" style="font-weight:800">${t.type==='مصروف'?'-':'+'}${money(t.amount)}</td>${full?`<td><button class="mini-btn danger" data-action="deleteTx" data-id="${escape(t.id)}" aria-label="حذف">حذف</button></td>`:''}</tr>`).join('')}</tbody></table></div>`}
function notes(s){const insights=[];if(!monthTx().some(x=>x.type==='دخل'))insights.push(['◉','سجل دخلك الشهري','لم تسجل دخلًا لهذا الشهر بعد. عند إدخاله سيظهر معدل الادخار الفعلي.']);if(s.expense>0&&s.expense>=.8*s.budget)insights.push(['⚠','تنبيه الميزانية',s.expense>s.budget?'تجاوزت سقف المصروفات المخطط. راجع أكبر الفئات.':'أنت قريب من الحد الشهري؛ راقب المصروفات المتبقية.']);if(s.emergency<27000)insights.push(['♧','الهدف الأول: صندوق الطوارئ',`رصيدك المسجل ${money(s.emergency)}؛ استهدف أولًا ${money(27000)} لتغطية ثلاثة أشهر.`]);else if(s.emergency<cfg('الطوارئ المستهدفة'))insights.push(['✓','تقدم جيد في الأمان المالي',`باقي ${money(cfg('الطوارئ المستهدفة')-s.emergency)} للوصول لهدف صندوق الطوارئ.`]);else insights.push(['↗','صندوق الطوارئ مكتمل','يمكنك مراجعة المبلغ المخصص للاستثمار مع الحفاظ على سيولة الطوارئ.']);if(s.expense===0)insights.push(['↗','ابدأ بالتسجيل اليومي','التقارير لا تعتمد على بيانات افتراضية؛ كل رسم سيُحدّث من معاملاتك الحقيقية.']);return insights.slice(0,3).map(([ico,title,desc])=>`<div class="insight"><div class="insight-icon">${ico}</div><div><strong>${title}</strong><p class="muted">${desc}</p></div></div>`).join('')}
function renderOverview(){const s=getStats(),b=expensesByBucket(),goal=cfg('الطوارئ المستهدفة'),rate=s.income>0?(s.income-s.expense)/s.income:0;return `
<div class="hero"><div><div class="eyebrow">✦ خطة مالية تناسبك</div><h2>مساء الخير، أهلاً بك في فلوسي 👋</h2><p>تابع مصروفاتك، ابنِ صندوق الطوارئ، وراقب تقدمك المالي في مكان واحد — الأرقام الفعلية فقط، بدون نتائج وهمية.</p><div class="hero-actions"><button class="primary" data-action="newTx" data-type="مصروف">＋ تسجيل مصروف</button><button class="outline" data-action="newTx" data-type="دخل">＋ تسجيل دخل</button></div></div><div class="hero-stat"><small>الفائض الشهري المخطط</small><strong>${money(cfg('المرتب الشهري')-s.budget)}</strong><small>من دخلك ${money(cfg('المرتب الشهري'))}</small></div></div>
<div class="grid kpi-grid"><div class="panel kpi"><span class="kpi-icon">▣</span><div class="kpi-label">الدخل المسجل</div><div class="kpi-value">${money(s.income)}</div><div class="kpi-note">المخطط: ${money(cfg('المرتب الشهري'))}</div></div><div class="panel kpi blue"><span class="kpi-icon">◫</span><div class="kpi-label">المصروفات المسجلة</div><div class="kpi-value">${money(s.expense)}</div><div class="kpi-note">السقف: ${money(s.budget)}</div></div><div class="panel kpi purple"><span class="kpi-icon">↗</span><div class="kpi-label">صافي التدفق الشهري</div><div class="kpi-value ${s.net<0?'expense-color':'income-color'}">${money(s.net)}</div><div class="kpi-note">الدخل الفعلي − المصروفات الفعلية</div></div><div class="panel kpi gold"><span class="kpi-icon">♧</span><div class="kpi-label">صندوق الطوارئ</div><div class="kpi-value">${money(s.emergency)}</div><div class="kpi-note">${Math.round(clamp(s.emergency/Math.max(goal,1))*100)}% من هدف ${money(goal)}</div></div></div>
<div class="grid two" style="margin-top:14px">${panel('تطور الدخل والمصروفات',svgTrend(),'<span class="badge">آخر 6 أشهر</span>')}${panel('توزيع المصروفات',distribution(),'<span class="badge">الشهر المحدد</span>')}</div>
<div class="grid two" style="margin-top:14px">${panel('الميزانية مقابل الفعلي',progress('الإيجار',b['إيجار'],cfg('الإيجار'))+progress('الفواتير',b['فواتير'],cfg('الفواتير'))+progress('المعيشة',b['المعيشة'],cfg('المعيشة')),'<button class="outline" data-action="navigate" data-view="budget">تفاصيل الميزانية</button>')}${panel('أهدافك واحتياطياتك',progress('صندوق الطوارئ',s.emergency,goal)+progress('مساهمات الاستثمار',s.investment,30000)+progress('الاحتياطي غير المنتظم',s.reserve,12000),'<button class="outline" data-action="navigate" data-view="goals">الأهداف</button>')}</div>
<div class="grid two" style="margin-top:14px">${panel('آخر المعاملات',recentTable(),'<button class="outline" data-action="navigate" data-view="transactions">عرض الكل</button>')}${panel('رؤية مالية عملية',notes(s),'<span class="pill">تحليل قائم على قواعد واضحة</span>')}</div>
<p class="footnote">الأرقام هنا تعتمد على معاملاتك المسجلة. «صافي التدفق» لا يعني الرصيد البنكي، ومساهمات الاستثمار ليست بالضرورة القيمة السوقية.</p>`}
function renderTransactions(){const s=getStats();return `<div class="toolrow"><div><h2 class="page-title">سجل المعاملات</h2><p class="page-sub">إضافة وتتبع كل حركة؛ التحويلات الداخلية لا تُحسب كمصروفات.</p></div><div class="btn-row"><button class="primary" data-action="newTx" data-type="مصروف">＋ مصروف جديد</button><button class="outline" data-action="newTx" data-type="دخل">＋ دخل جديد</button><button class="outline" data-action="exportCsv">تصدير CSV</button></div></div><div class="grid three"><div class="panel"><div class="muted">الدخل</div><div class="kpi-value income-color">${money(s.income)}</div></div><div class="panel"><div class="muted">المصروفات</div><div class="kpi-value expense-color">${money(s.expense)}</div></div><div class="panel"><div class="muted">صافي التدفق</div><div class="kpi-value">${money(s.net)}</div></div></div><div class="panel" style="margin-top:15px"><div class="toolrow"><input id="searchInput" class="search" placeholder="ابحث في المعاملات…" value="${escape(search)}"><select id="typeFilter" class="month"><option ${filter==='الكل'?'selected':''}>الكل</option>${TYPES.map(t=>`<option ${filter===t?'selected':''}>${t}</option>`).join('')}</select><span class="badge">${monthTx().length} عملية في الشهر</span></div>${recentTable(2000,true)}</div>`}
function renderBudget(){const s=getStats(),b=expensesByBucket(),target=cfg('المرتب الشهري'),remain=Math.max(0,s.budget-s.expense);return `<div class="toolrow"><div><h2 class="page-title">ميزانيتك الشهرية</h2><p class="page-sub">ميزانية صفرية: كل جنيه له وظيفة قبل إنفاقه.</p></div><button class="primary" data-action="editSettings">تعديل حدود الميزانية</button></div><div class="grid three"><div class="panel"><div class="muted">إجمالي الميزانية</div><div class="kpi-value">${money(s.budget)}</div></div><div class="panel"><div class="muted">المنفق فعليًا</div><div class="kpi-value">${money(s.expense)}</div></div><div class="panel"><div class="muted">المتبقي داخل الحد</div><div class="kpi-value income-color">${money(remain)}</div></div></div><div class="grid two" style="margin-top:14px">${panel('أداء بنود الإنفاق',progress('الإيجار',b['إيجار'],cfg('الإيجار'))+progress('الفواتير',b['فواتير'],cfg('الفواتير'))+progress('المعيشة',b['المعيشة'],cfg('المعيشة')))}${panel('خطة توزيع دخلك',`<div class="progress-item">${progress('تكاليف المعيشة الأساسية',s.budget,target)}${progress('الفائض المخطط',target-s.budget,target)}<div class="footnote">الفائض ${money(target-s.budget)} يُوزَّع على الطوارئ والاستثمار والاحتياطي وفق مراحل خطتك.</div></div>`)}</div>${panel('تفاصيل مصروفات الشهر',distribution(),'<button class="outline" data-action="newTx" data-type="مصروف">إضافة مصروف</button>')}`}
function goalCard(g){let n=num(g.initial),t=num(g.target),value=g.emergency?getStats().emergency:n;return `<article class="panel"><div class="flex-between"><div class="goal-ico">${g.emergency?'🛡':'◎'}</div>${g.emergency?'<span class="pill">هدف أساسي</span>':`<button class="mini-btn" data-action="editGoal" data-id="${escape(g.id)}">تعديل</button>`}</div><div class="goal-title" style="margin-top:13px">${escape(g.title)}</div><div class="muted small">${escape(g.note||'')}</div><div class="flex-between" style="margin-top:18px"><b>${money(value)}</b><span class="muted">من ${money(t)}</span></div><div class="bar" style="margin-top:8px"><span style="width:${pct(clamp(value/Math.max(t,1)))}"></span></div><div class="footnote">${Math.round(value/Math.max(1,t)*100)}% مكتمل ${g.deadline?' · الموعد: '+escape(g.deadline):''}</div></article>`}
function renderGoals(){const core={emergency:true,title:'صندوق الطوارئ',target:cfg('الطوارئ المستهدفة'),note:'ستة أشهر من نفقاتك الأساسية'};return `<div class="toolrow"><div><h2 class="page-title">الأهداف المالية</h2><p class="page-sub">ضع هدفًا قابلًا للقياس وتابع تقدمه شهريًا.</p></div><button class="primary" data-action="newGoal">＋ هدف جديد</button></div><div class="goals-grid">${[core,...state.goals].map(goalCard).join('')}</div><p class="footnote">الأهداف المخصصة تسجل مبلغ البداية يدويًا. صندوق الطوارئ يرتبط بتحويلاتك المسجلة تلقائيًا؛ لا تضف المبلغ ذاته مرتين.</p>`}
function renderInvestments(){const s=getStats(),w=s.hasValuation?s.portfolio:s.investment;return `<div class="toolrow"><div><h2 class="page-title">محفظتك الاستثمارية</h2><p class="page-sub">افصل بين مساهماتك وبين القيمة السوقية الفعلية للمحفظة.</p></div><div class="btn-row"><button class="primary" data-action="newTx" data-type="استثمار">＋ تحويل للاستثمار</button><button class="outline" data-action="newValuation">تحديث القيمة السوقية</button></div></div><div class="grid three"><div class="panel"><div class="muted">صافي المساهمات المسجلة</div><div class="kpi-value">${money(s.investment)}</div></div><div class="panel"><div class="muted">${s.hasValuation?'آخر تقييم للمحفظة':'قيمة سوقية غير مسجلة'}</div><div class="kpi-value">${s.hasValuation?money(w):'—'}</div></div><div class="panel"><div class="muted">${s.hasValuation?'الفرق عن المساهمات':'العائد السوقي'}</div><div class="kpi-value ${(w-s.investment)<0?'expense-color':'income-color'}">${s.hasValuation?money(w-s.investment):'غير متاح'}</div></div></div>${panel('سجل التقييمات',state.valuations.length?`<div class="table-scroll"><table class="table"><thead><tr><th>التاريخ</th><th>القيمة</th><th>ملاحظات</th></tr></thead><tbody>${state.valuations.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<tr><td>${escape(x.date)}</td><td>${money(x.value)}</td><td>${escape(x.note)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">سجل القيمة السوقية الحالية للمحفظة بعد فتح حسابك الاستثماري.</div>','<button class="outline" data-action="newValuation">＋ إضافة تقييم</button>')}<p class="footnote">لا يتم جلب أسعار الأسهم أو الذهب تلقائيًا. الفرق المحسوب لا يشمل الرسوم والضرائب، وقد يحتاج ضبطًا عند وجود توزيعات أو سحوبات.</p>`}
function billRow(b){const day=Math.min(31,num(b.dueDay)),today=Number(iso().slice(-2)),diff=day-today;return `<tr><td>${escape(b.title)}</td><td>${money(b.amount)}</td><td>يوم ${day} من الشهر</td><td>${diff>=0&&diff<=7?'<span class="tag exp">خلال '+diff+' يوم</span>':b.active?'<span class="tag">نشطة</span>':'<span class="badge">موقفة</span>'}</td><td><button data-action="editBill" data-id="${escape(b.id)}" class="mini-btn">تعديل</button></td></tr>`}
function renderBills(){const active=state.bills.filter(x=>x.active);return `<div class="toolrow"><div><h2 class="page-title">الفواتير والاشتراكات</h2><p class="page-sub">تذكيرات داخل التطبيق للمواعيد المتكررة، وليست خصومات بنكية آلية.</p></div><button class="primary" data-action="newBill">＋ فاتورة متكررة</button></div><div class="grid three"><div class="panel"><div class="muted">الالتزامات المسجلة شهريًا</div><div class="kpi-value">${money(active.reduce((a,x)=>a+num(x.amount),0))}</div></div><div class="panel"><div class="muted">الفواتير النشطة</div><div class="kpi-value">${active.length}</div></div><div class="panel"><div class="muted">الفواتير خلال 7 أيام</div><div class="kpi-value">${active.filter(x=>num(x.dueDay)>=Number(iso().slice(-2))&&num(x.dueDay)<=Number(iso().slice(-2))+7).length}</div></div></div><div class="panel" style="margin-top:14px">${state.bills.length?`<div class="table-scroll"><table class="table"><thead><tr><th>الفاتورة</th><th>القيمة</th><th>الاستحقاق</th><th>الحالة</th><th></th></tr></thead><tbody>${state.bills.map(billRow).join('')}</tbody></table></div>`:'<div class="empty-state">لا توجد فواتير دورية بعد. أضف الإيجار، الإنترنت، أو أي اشتراك شهري لتتابع موعده.</div>'}</div>`}
function renderReports(){const s=getStats(),months=lastMonths(6),rows=months.map(m=>{const t=state.transactions.filter(x=>x.date.startsWith(m));const income=sum(t,'دخل'),expense=sum(t,'مصروف');return {m,income,expense,net:income-expense}});return `<div class="toolrow"><div><h2 class="page-title">التقارير والتحليلات</h2><p class="page-sub">تتبع أداءك المالي باستخدام معاملات حقيقية ومؤشرات واضحة.</p></div><button class="outline" data-action="exportCsv">⬇ تصدير معاملات CSV</button></div><div class="grid three"><div class="panel"><div class="muted">معدل الادخار الفعلي</div><div class="kpi-value">${s.income>0?pct((s.income-s.expense)/s.income):'—'}</div><div class="small muted">لا يُحسب دون دخل مسجل</div></div><div class="panel"><div class="muted">تغطية الطوارئ</div><div class="kpi-value">${(s.emergency/Math.max(1,s.budget)).toFixed(1)} شهر</div></div><div class="panel"><div class="muted">نسبة الاستهلاك</div><div class="kpi-value">${pct(s.expense/Math.max(1,s.budget))}</div></div></div><div class="grid two" style="margin-top:14px">${panel('التحليل الشهري',svgTrend())}${panel('توزيع المصروفات',distribution())}</div>${panel('ملخص آخر 6 أشهر',`<div class="table-scroll"><table class="table"><thead><tr><th>الشهر</th><th>الدخل</th><th>المصروفات</th><th>الفائض</th><th>الادخار %</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${escape(r.m)}</td><td>${money(r.income)}</td><td>${money(r.expense)}</td><td class="${r.net<0?'expense-color':'income-color'}">${money(r.net)}</td><td>${r.income?pct(r.net/r.income):'—'}</td></tr>`).join('')}</tbody></table></div>`)}<p class="footnote">مؤشرات الموازنة تقديرية وفق البيانات المدخلة وليست تقييمًا ائتمانيًا أو نصيحة استثمارية.</p>`}
function renderSettings(){return `<div class="toolrow"><div><h2 class="page-title">الإعدادات وبياناتك</h2><p class="page-sub">حدّث دخلك وتكلفة معيشتك مع الحفاظ على بياناتك الحالية.</p></div><button class="primary" data-action="editSettings">تعديل الإعدادات</button></div>${panel('معلومات الخطة المالية',`<div class="grid two"><div>${Object.entries(state.settings).slice(0,6).map(([k,v])=>`<div class="progress-item flex-between"><span>${escape(k)}</span><b>${money(v)}</b></div>`).join('')}</div><div><h3>خصوصية البيانات</h3><p class="muted">${LIVE?'التطبيق يعمل داخل Google Apps Script، ويقرأ ويكتب في Google Sheets الخاص بك؛ اضبط الوصول عند النشر على «أنا فقط».':'نسخة تجربة محلية. تُحفظ البيانات في متصفحك حتى تقوم بتوصيلها بـGoogle Apps Script.'}</p><p class="muted">لا تدخل كلمات مرور، أرقام بطاقات، أو رموز تحقق في وصف المعاملات.</p><div class="btn-row"><button class="outline" data-action="export">نسخة احتياطية JSON</button><button class="outline" data-action="exportCsv">CSV للمعاملات</button></div><div class="footnote">النسخ الاحتياطية مهمة قبل إجراء تغييرات كبيرة.</div><p style="margin-top:18px"><a href="${SHEET_URL}" target="_blank" rel="noopener noreferrer">فتح قاعدة البيانات في Google Sheets ↗</a></p></div></div>`)}<p class="footnote">في إصدار Apps Script لا يُستورد JSON تلقائيًا حفاظًا على سلامة بيانات Google Sheets؛ يُستخدم كنسخة احتياطية.</p>`}
function input(label,name,type='text',value='',required=true,options=null){return `<div class="field"><label for="f_${name}">${label}</label>${options?`<select name="${name}" id="f_${name}">${options.map(x=>`<option value="${escape(x)}" ${String(x)===String(value)?'selected':''}>${escape(x)}</option>`).join('')}</select>`:`<input id="f_${name}" name="${name}" type="${type}" ${required?'required':''} ${type==='number'?'step="0.01" min="0"':''} value="${escape(value)}">`}</div>`}
function openModal(kind,rec={}){let title='',fields='',submit='حفظ العملية';if(kind==='tx'){title='إضافة معاملة مالية';fields=`${input('التاريخ','date','date',rec.date||iso())}${input('نوع العملية','type','text',rec.type||'مصروف',true,TYPES)}${input('الفئة','category','text',rec.category||'طعام',true,[...CAT,'مرتب','دخل إضافي','صندوق الطوارئ','استثمار','احتياطي'])}${input('المبلغ (جنيه)','amount','number',rec.amount||'')}${input('وصف مختصر','description','text',rec.description||'',false)}${input('ملاحظات','notes','text',rec.notes||'',false)}`}
else if(kind==='goal'){title=rec.id?'تعديل الهدف':'إنشاء هدف مالي';fields=`${input('اسم الهدف','title','text',rec.title||'')}${input('المبلغ المستهدف','target','number',rec.target||'')}${input('المبلغ المتحقق حاليًا','initial','number',rec.initial||0)}${input('الموعد المستهدف','deadline','date',rec.deadline||'',false)}<div class="field" style="grid-column:1/-1"><label>ملاحظات</label><textarea name="note">${escape(rec.note||'')}</textarea></div>`}
else if(kind==='bill'){title=rec.id?'تعديل الفاتورة':'إضافة فاتورة دورية';fields=`${input('اسم الفاتورة','title','text',rec.title||'')}${input('المبلغ','amount','number',rec.amount||'')}${input('يوم الاستحقاق (1–31)','dueDay','number',rec.dueDay||1)}${input('الفئة','category','text',rec.category||'فواتير',true,CAT)}${input('الحالة','active','text',rec.active===false?'موقفة':'نشطة',true,['نشطة','موقفة'])}${input('ملاحظات','note','text',rec.note||'',false)}`}
else if(kind==='valuation'){title='تحديث قيمة المحفظة السوقية';fields=`${input('التاريخ','date','date',iso())}${input('القيمة السوقية الحالية','value','number','')}${input('ملاحظات','note','text','',false)}`}
else if(kind==='settings'){title='تعديل خطة الميزانية';fields=Object.entries(state.settings).map(([k,v],i)=>input(k,'setting_'+i,'number',v)).join('')}
$('modal').innerHTML=`<div class="modal-header"><h2>${title}</h2><button class="mini-btn" data-action="closeModal" aria-label="إغلاق">✕</button></div><form id="modalForm" data-kind="${kind}" data-id="${escape(rec.id||'')}"><div class="form-grid">${fields}</div><div class="modal-actions">${rec.id&&kind!=='tx'?`<button type="button" class="mini-btn danger" data-action="deleteRecord" data-kind="${kind}" data-id="${escape(rec.id)}">حذف</button>`:''}<button type="button" class="outline" data-action="closeModal">إلغاء</button><button type="submit" id="modalSave" class="primary">${submit}</button></div></form>`;$('modalBackdrop').classList.add('show')}
function closeModal(){$('modalBackdrop').classList.remove('show');$('modal').innerHTML=''}
async function onSubmit(e){if(e.target.id!=='modalForm')return;e.preventDefault();const form=e.target,kind=form.dataset.kind,id=form.dataset.id;const p=Object.fromEntries(new FormData(form).entries());$('modalSave').disabled=true;if(kind==='tx'){p.amount=Number(p.amount);if(p.amount<=0){$('modalSave').disabled=false;return toast('المبلغ يجب أن يكون أكبر من صفر',true)};await mutate('addTransaction',p)}if(kind==='goal'){p.target=Number(p.target);p.initial=Number(p.initial);if(id)p.id=id;await mutate('saveGoal',p)}if(kind==='bill'){p.amount=Number(p.amount);p.dueDay=Number(p.dueDay);p.active=p.active==='نشطة';if(id)p.id=id;await mutate('saveBill',p)}if(kind==='valuation'){p.value=Number(p.value);await mutate('saveValuation',p)}if(kind==='settings'){const settings={};Object.keys(state.settings).forEach((key,i)=>settings[key]=Number(p['setting_'+i]));await mutate('saveSettings',settings)}}
function exportFile(name,blob,type){const url=URL.createObjectURL(new Blob([blob],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function csv(){const header=['التاريخ','النوع','الفئة','الوصف','المبلغ','ملاحظات'];const escCsv=s=>{let v=String(s??'');if(/^[\s]*[=+@-]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};const rows=state.transactions.map(r=>[r.date,r.type,r.category,r.description,r.amount,r.notes].map(escCsv).join(','));exportFile('flosy_transactions.csv','\ufeff'+[header.map(escCsv).join(','),...rows].join('\n'),'text/csv;charset=utf-8')}
function click(e){const el=e.target.closest('[data-action]');if(!el)return;const act=el.dataset.action;if(act==='toggleNav'){$('sidebar').classList.toggle('open');$('sidebarOverlay').classList.toggle('show')}if(act==='navigate'){view=el.dataset.view;$('sidebar').classList.remove('open');$('sidebarOverlay').classList.remove('show');render();window.scrollTo({top:0,behavior:'smooth'})}if(act==='refresh')refresh();if(act==='newTx')openModal('tx',{type:el.dataset.type||'مصروف'});if(act==='newGoal')openModal('goal');if(act==='newBill')openModal('bill');if(act==='newValuation')openModal('valuation');if(act==='editSettings')openModal('settings');if(act==='editGoal')openModal('goal',state.goals.find(x=>x.id===el.dataset.id)||{});if(act==='editBill')openModal('bill',state.bills.find(x=>x.id===el.dataset.id)||{});if(act==='closeModal')closeModal();if(act==='export')exportFile('flosy-backup-'+iso()+'.json',JSON.stringify(state,null,2),'application/json');if(act==='exportCsv')csv();if(act==='deleteTx'&&confirm('هل تريد حذف هذه العملية نهائيًا من سجل المعاملات؟'))mutate('deleteTransaction',el.dataset.id);if(act==='deleteRecord'&&confirm('هل تريد حذف هذا العنصر؟'))mutate(el.dataset.kind==='goal'?'deleteGoal':'deleteBill',el.dataset.id)}
$('monthSelector').addEventListener('change',e=>{month=e.target.value;render()});document.addEventListener('click',click);document.addEventListener('submit',onSubmit);$('sidebarOverlay').addEventListener('click',()=>{$('sidebar').classList.remove('open');$('sidebarOverlay').classList.remove('show')});$('modalBackdrop').addEventListener('click',e=>{if(e.target===$('modalBackdrop'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});document.addEventListener('input',e=>{if(e.target.id==='searchInput'){search=e.target.value;const tmp=$('searchInput');const pos=tmp.selectionStart;render();$('searchInput').focus();$('searchInput').setSelectionRange(pos,pos)}});document.addEventListener('change',e=>{if(e.target.id==='typeFilter'){filter=e.target.value;render()}});
month=iso().slice(0,7);refresh();
})();
</script>
</body></html>
