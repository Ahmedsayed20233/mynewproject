name: Flosy Real Browser Smoke
on:
  push:
    branches: [flosy-site, "test/**", "feature/**"]
    paths:
      - 'tests/browser-smoke.cjs'
      - 'flosy-ai.js'
      - 'flosy-automate-relay.js'
      - 'flosy-automate-relay.css'
      - 'flosy-elevate.js'
      - 'flosy-elevate.css'
      - 'finance-pro.js'
      - 'flosy-repair.js'
      - 'flosy-v4-capture.js'
      - 'index.html'
      - 'flosy-ultra.html'
      - 'flosy.html'
      - 'flosy-unified*'
      - 'flosy-ai-experience-v396.*'
      - 'flosy-customer-v397.*'
      - 'flosy-needs-v398.js'
      - 'flosy-needs-ui-v398.*'
      - 'flosy-receipt-intelligence-v398.js'
      - 'flosy-receipt-trained-v398.js'
      - 'tests/v398-browser.cjs'
      - 'tests/customer-v397-browser.cjs'
      - 'tests/v396-ai-browser.cjs'
      - 'flosy-ux-v391.*'
      - 'flosy-categories-v391.js'
      - 'flosy-legacy-theme-v391.css'
      - 'tests/v391-browser.cjs'
      - 'tests/v392-browser.cjs'
      - 'flosy-voice-nlu.js'
      - 'flosy-voice-safety-v2.js'
      - 'flosy-nlu-compact-vocab.js'
      - 'flosy-nlu-compact-weights.js'
      - 'flosy-egyptian-nlu-compact-v2.js'
      - 'flosy-capture-review-v2.js'
      - 'flosy-capture-review-v2.css'
      - 'flosy-report-kit.js'
      - 'flosy-report-pro.*'
      - 'flosy-services-v392.*'
      - 'flosy-screen-map-v395.js'
      - 'tests/screen-consolidation.test.cjs'
      - 'flosy-copilot-v392.js'
      - 'flosy-finance-*.js'
      - 'flosy-finance-*.css'
      - 'tests/v393-browser.cjs'
      - 'tests/unified-browser.cjs'
      - 'flosy-ultra-*'
      - 'tests/ultra-browser.cjs'
      - '.github/workflows/flosy-browser-smoke.yml'
  pull_request:
    branches: [flosy-site]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    name: Test live Flosy DOM in Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright runner and Chromium
        run: |
          npm install --no-save playwright@1.58.0
          npx playwright install chromium # Hosted runner already has browser libraries; avoid apt DNS failures
      - name: Exercise voice, receipt and free AI UX
        run: node tests/browser-smoke.cjs
      - name: Exercise all 12 exact designer screens and 3 themes in Chromium
        run: node tests/ultra-browser.cjs
      - name: Verify unified 20-screen four-theme app and live ledger
        run: node tests/unified-browser.cjs
      - name: Verify v3.9.1 editable transactions, voice, OCR and four-theme settings
        run: node tests/v391-browser.cjs
      - name: Test spending tiers and trained receipt parser with real review controls
        run: node tests/v398-browser.cjs
      - name: Test real new customer account wizard, repeat and selective OCR/voice review
        run: node tests/customer-v397-browser.cjs
      - name: Test Flosy AI reference-image UI, voice, OCR, budget and crisis actions
        run: node tests/v396-ai-browser.cjs
      - name: Test PDF/Excel Save As, AI Roast Me, named daily insights and notification UX
        run: node tests/v392-browser.cjs
      - name: Test unified financial profile, budget, categories, wealth, zakat and friend/family workflows
        run: node tests/v393-browser.cjs
      - name: Save successful desktop/mobile screenshot preview
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flosy-elevate-ui-preview
          path: |
            tests/_artifacts/elevate-dashboard.png
            tests/_artifacts/elevate-mobile-390px.png
            tests/_artifacts/flosy-studio-mobile-quick-add.png
            tests/_artifacts/ultra-emerald-356.png
            tests/_artifacts/ultra-daylight-356.png
            tests/_artifacts/ultra-sapphire-356.png
            tests/_artifacts/flosy-ai-v396-chat.png
            tests/_artifacts/flosy-v397-onboarding.png
            tests/_artifacts/flosy-v398-needs.png
            tests/_artifacts/flosy-v397-home-safe.png
            tests/_artifacts/flosy-ai-v396-actions.png
            tests/_artifacts/flosy-ai-v396-insights.png
          retention-days: 7
          if-no-files-found: error
      - name: Save desktop and mobile design screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flosy-studio-white-mode-previews
          path: |
            tests/_artifacts/elevate-dashboard.png
            tests/_artifacts/elevate-mobile-390px.png
          if-no-files-found: error
          retention-days: 14
      - name: Save failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flosy-browser-failure
          path: tests/_artifacts/*
          if-no-files-found: ignore
