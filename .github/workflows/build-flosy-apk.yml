name: Build Flosy Android APK
on:
  push:
    branches: [flosy-android, "fix/**", "feature/flosy-free-automate-relay-android-v29"]
    paths:
      - 'android/**'
      - '.github/workflows/build-flosy-apk.yml'
  pull_request:
    branches: [flosy-android]
  workflow_dispatch:
concurrency:
  group: flosy-android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK platform
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify all-white native theme
        run: |
          grep -q "Theme.Material.Light.NoActionBar" android/app/src/main/AndroidManifest.xml
          grep -q "webView.setBackgroundColor(Color.WHITE)" android/app/src/main/java/com/flosy/finance/MainActivity.java
          grep -q "FLOSY_NATIVE_OCR_AVAILABLE=true" android/app/src/main/java/com/flosy/finance/MainActivity.java
          grep -q "setAllowContentAccess(true)" android/app/src/main/java/com/flosy/finance/MainActivity.java
          grep -q "addWebMessageListener" android/app/src/main/java/com/flosy/finance/MainActivity.java
          grep -q "RECORD_AUDIO" android/app/src/main/AndroidManifest.xml
          grep -q "ACTION_IMAGE_CAPTURE" android/app/src/main/java/com/flosy/finance/MainActivity.java
          grep -q "ACTION_CREATE_DOCUMENT" android/app/src/main/java/com/flosy/finance/MainActivity.java
          # No banking/notification high-risk permission may be requested by either variant.
          # Scan actual XML attributes, not explanatory comments mentioning old permissions.
          if grep -Eq '<uses-permission[^>]*android\.permission\.(READ_SMS|RECEIVE_SMS|SEND_SMS)|android:permission="android\.permission\.(BIND_NOTIFICATION_LISTENER_SERVICE|BIND_ACCESSIBILITY_SERVICE)"' \
              android/app/src/main/AndroidManifest.xml android/app/src/sms/AndroidManifest.xml; then
            echo "Blocked: restricted SMS/notification permission in Android manifest"; exit 1
          fi
          if grep -Eq 'Telephony.Sms|Manifest.permission.READ_SMS|InstaPayNotificationReader' \
              android/app/src/main/java/com/flosy/finance/MainActivity.java; then
            echo "Blocked: retired broad SMS/notification scanner still referenced"; exit 1
          fi
          grep -q 'android.intent.action.SEND' android/app/src/main/AndroidManifest.xml
          grep -q 'com.flosy.finance.REVIEW_EXTERNAL_FINANCIAL_EVENT' android/app/src/main/AndroidManifest.xml
          grep -q 'MessageDigest.isEqual' android/app/src/main/java/com/flosy/finance/AutoRelayStore.java
          grep -q 'AES/GCM/NoPadding' android/app/src/main/java/com/flosy/finance/AutoRelayStore.java
          # Regression guard: AndroidKeyStore rejects caller-specified GCM IVs in ENCRYPT_MODE.
          grep -Fq 'cipher.init(Cipher.ENCRYPT_MODE,secret());' android/app/src/main/java/com/flosy/finance/AutoRelayStore.java
          grep -Fq 'byte[] iv=cipher.getIV();' android/app/src/main/java/com/flosy/finance/AutoRelayStore.java
          if grep -Fq 'cipher.init(Cipher.ENCRYPT_MODE,secret(),new GCMParameterSpec' android/app/src/main/java/com/flosy/finance/AutoRelayStore.java; then
            echo 'Unsafe: caller-supplied encryption IV'; exit 1
          fi
          grep -q 'AutoRelayStore.accept' android/app/src/main/java/com/flosy/finance/AutoRelayReceiver.java
          grep -q 'if(window.FLOSY_AUTOMATE_RELAY)' android/app/src/main/java/com/flosy/finance/MainActivity.java

      - name: Compile both Android versions
        run: |
          gradle -p android --no-daemon --stacktrace assembleStandardDebug assembleSmsDebug

      - name: Validate and stage APKs
        run: |
          set -e
          STANDARD="android/app/build/outputs/apk/standard/debug/app-standard-debug.apk"
          SMS="android/app/build/outputs/apk/sms/debug/app-sms-debug.apk"
          test -s "$STANDARD"
          test -s "$SMS"
          mkdir -p dist
          cp "$STANDARD" dist/Flosy-Android-Standard-v2.9.0.apk
          cp "$SMS" dist/Flosy-Android-Safe-Automate-v2.9.0.apk
          for APK in "$STANDARD" "$SMS"; do
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -8
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee /tmp/flosy-permissions.txt
            if grep -Eq 'android.permission.(READ_SMS|RECEIVE_SMS|SEND_SMS|BIND_NOTIFICATION_LISTENER_SERVICE|BIND_ACCESSIBILITY_SERVICE)' /tmp/flosy-permissions.txt; then
              echo "Unsafe declared permission found in $APK"; exit 1
            fi
          done
          ls -lh dist/*.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Flosy-Android-2.9-Automate-Safe-APK
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish two APKs as GitHub Release
        if: github.ref == 'refs/heads/flosy-android' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="flosy-android-v2.9.0"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/*.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "فلوسي Android v2.9.0 — Free Automate Relay" \
              --notes "Flosy 2.9 introduces a FREE Android-to-Android financial event bridge for the official Automate app by LlamaLab. A user creates a local pairing token in Flosy and authorizes selected SMS senders and InstaPay/bank notification packages within Automate; only candidate transactions enter a bounded, encrypted local review queue. Flosy itself requires NO READ_SMS, RECEIVE_SMS or Notification Access and never auto-commits money movements. Configure Automate blocks separately. Standard and Safe Automate APKs are debug-signed testing builds, not Play-approved production releases. Backup all Flosy data before uninstalling older builds because signatures may differ. Keep Play Protect enabled; installation may still be restricted on specific devices."
          fi
