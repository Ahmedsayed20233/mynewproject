name: Build Flosy Android APK
on:
  push:
    branches: [flosy-android, "fix/**", "feature/**"]
    paths:
      - 'android/**'
      - '.github/workflows/build-flosy-apk.yml'
  pull_request:
    branches: [flosy-android]
  workflow_dispatch:
concurrency:
  group: flosy-android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK platform
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify MVP excludes messaging features
        run: |
          set -eu
          grep -Fq "versionName '3.8.1'" android/app/build.gradle
          grep -Fq "applicationIdSuffix '.ultra.plus'" android/app/build.gradle
          grep -Fq 'tools:node="remove"' android/app/src/mvp/AndroidManifest.xml
          grep -Fq 'tools:node="replace"' android/app/src/mvp/AndroidManifest.xml
          grep -Fq 'FLOSY_MVP_NO_MESSAGE_IMPORT' android/app/src/main/java/com/flosy/finance/MainActivity.java
          grep -Fq 'configureMvpWebUi()' android/app/src/main/java/com/flosy/finance/MainActivity.java
          grep -Fq 'if(isMvp()' android/app/src/main/java/com/flosy/finance/MainActivity.java
          if grep -E '<uses-permission[^>]+(READ_SMS|RECEIVE_SMS|SEND_SMS)' android/app/src/mvp/AndroidManifest.xml; then
            echo "MVP must have no SMS permission"; exit 1
          fi
          grep -Fq 'POST_NOTIFICATIONS' android/app/src/mvp/AndroidManifest.xml
          grep -Fq 'RECEIVE_BOOT_COMPLETED' android/app/src/mvp/AndroidManifest.xml
          grep -Fq 'FlosyReminderReceiver' android/app/src/mvp/AndroidManifest.xml
          grep -Fq 'notifications-enable' android/app/src/main/java/com/flosy/finance/MainActivity.java
          grep -Fq 'notifications-sync' android/app/src/main/java/com/flosy/finance/MainActivity.java
          grep -Fq 'ROOT + "flosy-ultra.html"' android/app/src/main/java/com/flosy/finance/MainActivity.java
          grep -Fq 'ultra-ai-speak' android/app/src/main/java/com/flosy/finance/MainActivity.java
          grep -Fq 'ar-EG' android/app/src/main/java/com/flosy/finance/FlosyUltraSpeech.java
          grep -Fq 'TextToSpeech' android/app/src/main/java/com/flosy/finance/FlosyUltraSpeech.java
          grep -Fq 'setAndAllowWhileIdle' android/app/src/main/java/com/flosy/finance/FlosyReminderScheduler.java
          grep -Fq 'RECORD_AUDIO' android/app/src/main/AndroidManifest.xml
          grep -Fq 'ACTION_CREATE_DOCUMENT' android/app/src/main/java/com/flosy/finance/MainActivity.java

      - name: Compile founder-test MVP APK
        run: gradle -p android --no-daemon --stacktrace assembleMvpDebug

      - name: Verify installable APK manifest, signing and contents
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/mvp/debug/app-mvp-debug.apk"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGN="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" | tee /tmp/flosy-mvp-badging.txt
          grep -q "name='com.flosy.finance.ultra.plus'" /tmp/flosy-mvp-badging.txt
          grep -q "versionName='3.8.1'" /tmp/flosy-mvp-badging.txt
          "$AAPT" dump permissions "$APK" | tee /tmp/flosy-mvp-permissions.txt
          if grep -E 'android.permission.(READ_SMS|RECEIVE_SMS|SEND_SMS|READ_CALL_LOG|BIND_NOTIFICATION_LISTENER_SERVICE|BIND_ACCESSIBILITY_SERVICE)' /tmp/flosy-mvp-permissions.txt; then
            echo "BLOCKED: MVP APK contains restricted messages/notification permission"; exit 1
          fi
          grep -q 'android.permission.POST_NOTIFICATIONS' /tmp/flosy-mvp-permissions.txt
          grep -q 'android.permission.RECEIVE_BOOT_COMPLETED' /tmp/flosy-mvp-permissions.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/flosy-mvp-manifest.txt
          grep -q 'FlosyReminderReceiver' /tmp/flosy-mvp-manifest.txt
          if grep -E 'AutoRelayReceiver|DirectSmsReceiver|DirectNotificationListener|REVIEW_EXTERNAL_FINANCIAL_EVENT|SMS_RECEIVED|android.intent.action.SEND' /tmp/flosy-mvp-manifest.txt; then
            echo "BLOCKED: MVP APK exports a message import component"; exit 1
          fi
          "$SIGN" verify --verbose "$APK"
          unzip -t "$APK" >/dev/null
          mkdir -p dist
          cp "$APK" dist/Flosy-Ultra-Plus-v3.8.1.apk
          ls -lh dist/*.apk

      - name: Upload MVP testing APK
        uses: actions/upload-artifact@v4
        with:
          name: Flosy-Ultra-Plus-v3.8.1-More-Features
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish verified MVP APK to GitHub Releases
        if: github.ref == 'refs/heads/flosy-android' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="flosy-ultra-plus-v3.8.1"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/*.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Flosy Ultra+ v3.8.1 — all legacy features restored via More, corrected native status bar and themes" \
              --notes "Flosy Ultra+ v3.8.1 founder MVP: fixes user-reported issues in designer-authored 12-screen interface. Removes the fake camera/dynamic island, 9:41, Wi-Fi and battery bars. Moves all three theme choices inside an accessible More panel without overlapping screen content. Adds a search-enabled More hub linking 29 finance tools and all original functional pages in the same-origin canonical Flosy engine: complete Flosy AI, advanced reports, budgets, investments, bills, backup/recovery, goals, crises, family planning and more. The original Ultra 12 screens and Egyptian voice AI remain. No SMS import or bank-notification listener permissions. Independent test package com.flosy.finance.ultra.plus to avoid Android debug-signature conflicts with earlier releases: local transactions do NOT automatically migrate across packages; use verified backup/sync. UI is loaded from hosted GitHub Pages, requiring network for first load. Android build checks package/permissions/ZIP/signature; real device installation and audio quality not validated. APK is debug-signed, NOT Google Play certified; do not bypass Play Protect."
          fi
