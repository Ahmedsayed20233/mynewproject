name: Build Flosy Android APK
on:
  push:
    branches: [flosy-android, "fix/**", "feature/**"]
    paths:
      - 'android/**'
      - '.github/workflows/build-flosy-apk.yml'
  pull_request:
    branches: [flosy-android]
  workflow_dispatch:
concurrency:
  group: flosy-android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK platform
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify MVP excludes messaging features
        run: |
          set -eu
          grep -Fq "versionName '3.12.0'" android/app/build.gradle
          grep -Fq "applicationIdSuffix '.unified.v3120'" android/app/build.gradle
          grep -Fq 'tools:node="remove"' android/app/src/mvp/AndroidManifest.xml
          grep -Fq 'tools:node="replace"' android/app/src/mvp/AndroidManifest.xml
          grep -Fq 'FLOSY_MVP_NO_MESSAGE_IMPORT' android/app/src/main/java/com/flosy/finance/MainActivity.java
          # v3.12.0 continues to host app JavaScript from GitHub Pages, not from APK assets.
          grep -Fq 'ROOT + "flosy.html"' android/app/src/main/java/com/flosy/finance/MainActivity.java
          grep -Fq 'configureMvpWebUi()' android/app/src/main/java/com/flosy/finance/MainActivity.java
          grep -Fq 'if(isMvp()' android/app/src/main/java/com/flosy/finance/MainActivity.java
          if grep -E '<uses-permission[^>]+(READ_SMS|RECEIVE_SMS|SEND_SMS)' android/app/src/mvp/AndroidManifest.xml; then
            echo "MVP must have no SMS permission"; exit 1
          fi
          grep -Fq 'POST_NOTIFICATIONS' android/app/src/mvp/AndroidManifest.xml
          grep -Fq 'RECEIVE_BOOT_COMPLETED' android/app/src/mvp/AndroidManifest.xml
          grep -Fq 'FlosyReminderReceiver' android/app/src/mvp/AndroidManifest.xml
          grep -Fq 'notifications-enable' android/app/src/main/java/com/flosy/finance/MainActivity.java
          grep -Fq 'notifications-sync' android/app/src/main/java/com/flosy/finance/MainActivity.java
          grep -Fq 'pdf-start' android/app/src/main/java/com/flosy/finance/MainActivity.java
          grep -Fq 'notifications-daily-enable' android/app/src/main/java/com/flosy/finance/MainActivity.java
          grep -Fq 'class FlosyPdfExporter' android/app/src/main/java/com/flosy/finance/FlosyPdfExporter.java
          grep -Fq 'class FlosyReportBridge' android/app/src/main/java/com/flosy/finance/FlosyReportBridge.java
          grep -Fq 'ROOT + "flosy.html"' android/app/src/main/java/com/flosy/finance/MainActivity.java
          grep -Fq 'ultra-ai-speak' android/app/src/main/java/com/flosy/finance/MainActivity.java
          grep -Fq 'ar-EG' android/app/src/main/java/com/flosy/finance/FlosyUltraSpeech.java
          grep -Fq 'TextToSpeech' android/app/src/main/java/com/flosy/finance/FlosyUltraSpeech.java
          grep -Fq 'setAndAllowWhileIdle' android/app/src/main/java/com/flosy/finance/FlosyReminderScheduler.java
          grep -Fq 'RECORD_AUDIO' android/app/src/main/AndroidManifest.xml
          grep -Fq 'ACTION_CREATE_DOCUMENT' android/app/src/main/java/com/flosy/finance/MainActivity.java

      - name: Compile founder-test MVP APK
        run: gradle -p android --no-daemon --stacktrace assembleMvpDebug

      - name: Verify installable APK manifest, signing and contents
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/mvp/debug/app-mvp-debug.apk"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGN="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" | tee /tmp/flosy-mvp-badging.txt
          grep -q "name='com.flosy.finance.unified.v3120'" /tmp/flosy-mvp-badging.txt
          grep -q "versionName='3.12.0'" /tmp/flosy-mvp-badging.txt
          "$AAPT" dump permissions "$APK" | tee /tmp/flosy-mvp-permissions.txt
          if grep -E 'android.permission.(READ_SMS|RECEIVE_SMS|SEND_SMS|READ_CALL_LOG|BIND_NOTIFICATION_LISTENER_SERVICE|BIND_ACCESSIBILITY_SERVICE)' /tmp/flosy-mvp-permissions.txt; then
            echo "BLOCKED: MVP APK contains restricted messages/notification permission"; exit 1
          fi
          grep -q 'android.permission.POST_NOTIFICATIONS' /tmp/flosy-mvp-permissions.txt
          grep -q 'android.permission.RECEIVE_BOOT_COMPLETED' /tmp/flosy-mvp-permissions.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/flosy-mvp-manifest.txt
          grep -q 'FlosyReminderReceiver' /tmp/flosy-mvp-manifest.txt
          if grep -E 'AutoRelayReceiver|DirectSmsReceiver|DirectNotificationListener|REVIEW_EXTERNAL_FINANCIAL_EVENT|SMS_RECEIVED|android.intent.action.SEND' /tmp/flosy-mvp-manifest.txt; then
            echo "BLOCKED: MVP APK exports a message import component"; exit 1
          fi
          "$SIGN" verify --verbose "$APK"
          unzip -t "$APK" >/dev/null
          mkdir -p dist
          cp "$APK" dist/Flosy-Connected-Finance-v3.12.0.apk
          ls -lh dist/*.apk

      - name: Upload MVP testing APK
        uses: actions/upload-artifact@v4
        with:
          name: Flosy-Unified-v3.12.0-20-Screens
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish verified MVP APK to GitHub Releases
        if: github.ref == 'refs/heads/flosy-android' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="flosy-connected-finance-v3.12.0"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/*.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Flosy v3.12.0 — professional PDF, Excel and CSV reports" \
              --notes "Flosy v3.12.0 founder-test APK. New customer-first mobile UX: redesigned Home with recorded account balance, actual current-month spending/income and Safe to Spend daily estimate (unavailable when profile missing), dedicated last three expenses and next upcoming due date only if truly recorded. Five-tab dock; the central Add button opens a real one-step Quick Add form for expense, income or account-to-account transfer, optional advanced fields, common Egyptian expense shortcuts, automatic category hints from description, one ledger write, error feedback and native 16-second Undo. Voice and receipts have clearer correction and review controls; receipt image preview from selected local photos. Flosy AI gains grounded Egyptian-language why-spending-increased comparison (same days of month), five biggest expenses, hypothetical savings scenarios, Safe to Spend explanations, follow-up shortcuts and quick prompt chips. PDF, Excel (8 sheets) and UTF-8 Arabic CSV remain real native on-device exports via Android SAF. Report filters are hidden until requested, with one-tap current-month export. Supports light and dark; no SMS/notification permissions enabled. This is a founder test debug package com.flosy.finance.unified.v3120 and will not automatically migrate data from older test package IDs. Preserves OCR and spoken Egyptian parsers from earlier releases; no new visual OCR or acoustic ASR model training in this version. Runs hosted Flosy web UI from GitHub Pages, so site must deploy first. CI smoke tests pass; real-device usability and file picker QA still needed. Not production signed or Play Store ready. See docs/FLOSY_V312_CUSTOMER_EXPERIENCE_RELEASE_AR.md."
          fi
