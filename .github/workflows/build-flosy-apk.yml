name: Build Flosy Android APK
on:
  push:
    branches: [flosy-android]
    paths:
      - 'android/**'
      - '.github/workflows/build-flosy-apk.yml'
  workflow_dispatch:
concurrency:
  group: flosy-android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK platform
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile both Android versions
        run: |
          gradle -p android --no-daemon --stacktrace assembleStandardDebug assembleSmsDebug

      - name: Validate and stage APKs
        run: |
          set -e
          STANDARD="android/app/build/outputs/apk/standard/debug/app-standard-debug.apk"
          SMS="android/app/build/outputs/apk/sms/debug/app-sms-debug.apk"
          test -s "$STANDARD"
          test -s "$SMS"
          mkdir -p dist
          cp "$STANDARD" dist/Flosy-Android-Standard-v2.1.0.apk
          cp "$SMS" dist/Flosy-Android-SMS-Beta-v2.1.0.apk
          for APK in "$STANDARD" "$SMS"; do
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -8
          done
          ls -lh dist/*.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Flosy-Android-2.1-APK
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish two APKs as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="flosy-android-v2.1.0"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/*.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "فلوسي Android v2.1.0 — AI & SMS" \
              --notes "Two Android beta builds: Standard (manual sharing only, no sensitive SMS permission) and SMS Beta (user-opt-in READ_SMS for recent financial messages). Android sideloaded SMS APK may be blocked by Play Protect. Do not bypass device security. Flosy AI backend requires a separately configured OPENAI_API_KEY secret in Supabase. Neither build stores OpenAI keys. Both use the live website and existing Supabase sign-in."
          fi
