name: Build Flosy Android APK
on:
  push:
    branches: [flosy-android, "fix/**", "feature/**"]
    paths:
      - 'android/**'
      - '.github/workflows/build-flosy-apk.yml'
  pull_request:
    branches: [flosy-android]
  workflow_dispatch:
concurrency:
  group: flosy-android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK platform
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify all-white native theme
        run: |
          grep -q "Theme.Material.Light.NoActionBar" android/app/src/main/AndroidManifest.xml
          # Offline retry page must not inherit the trusted site origin.
          grep -Fq 'view.loadDataWithBaseURL("about:blank"' android/app/src/main/java/com/flosy/finance/MainActivity.java
          grep -q "webView.setBackgroundColor(Color.WHITE)" android/app/src/main/java/com/flosy/finance/MainActivity.java
          grep -q "FLOSY_NATIVE_OCR_AVAILABLE=true" android/app/src/main/java/com/flosy/finance/MainActivity.java
          grep -q "setAllowContentAccess(true)" android/app/src/main/java/com/flosy/finance/MainActivity.java
          grep -q "addWebMessageListener" android/app/src/main/java/com/flosy/finance/MainActivity.java
          grep -q "RECORD_AUDIO" android/app/src/main/AndroidManifest.xml
          grep -q "ACTION_IMAGE_CAPTURE" android/app/src/main/java/com/flosy/finance/MainActivity.java
          grep -q "ACTION_CREATE_DOCUMENT" android/app/src/main/java/com/flosy/finance/MainActivity.java
          # No banking/notification high-risk permission may be requested by either variant.
          # Scan actual XML attributes, not explanatory comments mentioning old permissions.
          if grep -Eq '<uses-permission[^>]*android\.permission\.(READ_SMS|RECEIVE_SMS|SEND_SMS)|android:permission="android\.permission\.(BIND_NOTIFICATION_LISTENER_SERVICE|BIND_ACCESSIBILITY_SERVICE)"' \
              android/app/src/main/AndroidManifest.xml android/app/src/sms/AndroidManifest.xml; then
            echo "Blocked: restricted SMS/notification permission in Android manifest"; exit 1
          fi
          if grep -Eq 'Telephony.Sms|Manifest.permission.READ_SMS|InstaPayNotificationReader' \
              android/app/src/main/java/com/flosy/finance/MainActivity.java; then
            echo "Blocked: retired broad SMS/notification scanner still referenced"; exit 1
          fi
          grep -Fq "versionName '3.5.0'" android/app/build.gradle
          grep -Fq 'private static final String HOME = "https://ahmedsayed20233.github.io/mynewproject/"' android/app/src/main/java/com/flosy/finance/MainActivity.java
          grep -Fq 'receiveNativeReceiptImage' android/app/src/main/java/com/flosy/finance/MainActivity.java
          grep -Fq 'AUTO_RELAY_QUEUE_UPDATED' android/app/src/main/java/com/flosy/finance/AutoRelayReceiver.java
          grep -q 'android.intent.action.SEND' android/app/src/main/AndroidManifest.xml
          grep -q 'com.flosy.finance.REVIEW_EXTERNAL_FINANCIAL_EVENT' android/app/src/main/AndroidManifest.xml
          grep -q 'MessageDigest.isEqual' android/app/src/main/java/com/flosy/finance/AutoRelayStore.java
          grep -q 'AES/GCM/NoPadding' android/app/src/main/java/com/flosy/finance/AutoRelayStore.java
          # Regression guard: AndroidKeyStore rejects caller-specified GCM IVs in ENCRYPT_MODE.
          grep -Fq 'cipher.init(Cipher.ENCRYPT_MODE,secret());' android/app/src/main/java/com/flosy/finance/AutoRelayStore.java
          grep -Fq 'byte[] iv=cipher.getIV();' android/app/src/main/java/com/flosy/finance/AutoRelayStore.java
          if grep -Fq 'cipher.init(Cipher.ENCRYPT_MODE,secret(),new GCMParameterSpec' android/app/src/main/java/com/flosy/finance/AutoRelayStore.java; then
            echo 'Unsafe: caller-supplied encryption IV'; exit 1
          fi
          # Broad SMS capture stays allowlisted and excludes authentication secrets.
          grep -Fq 'if(!sourceAllowed(c,source,sender))' android/app/src/main/java/com/flosy/finance/AutoRelayStore.java
          grep -Fq 'if(SECRET.matcher(text).find())' android/app/src/main/java/com/flosy/finance/AutoRelayStore.java
          grep -Fq 'if(!"sms".equals(source))' android/app/src/main/java/com/flosy/finance/AutoRelayStore.java
          grep -Fq 'if(!TX.matcher(text).find())' android/app/src/main/java/com/flosy/finance/AutoRelayStore.java
          grep -Fq 'if(!CURRENCY.matcher(text).find())' android/app/src/main/java/com/flosy/finance/AutoRelayStore.java
          grep -q 'AutoRelayStore.accept' android/app/src/main/java/com/flosy/finance/AutoRelayReceiver.java
          grep -q 'if(window.FLOSY_AUTOMATE_RELAY)' android/app/src/main/java/com/flosy/finance/MainActivity.java

      - name: Compile all Android MVP flavors
        run: |
          gradle -p android --no-daemon --stacktrace assembleStandardDebug assembleSmsDebug assembleDirectDebug

      - name: Validate and stage APKs
        run: |
          set -e
          STANDARD="android/app/build/outputs/apk/standard/debug/app-standard-debug.apk"
          SMS="android/app/build/outputs/apk/sms/debug/app-sms-debug.apk"
          DIRECT="android/app/build/outputs/apk/direct/debug/app-direct-debug.apk"
          test -s "$STANDARD"
          test -s "$SMS"
          test -s "$DIRECT"
          mkdir -p dist
          cp "$STANDARD" dist/Flosy-Android-Standard-v3.5.0.apk
          cp "$SMS" dist/Flosy-Safe-Automate-v3.5.0-ReceiptML-VoiceNLU.apk
          cp "$DIRECT" dist/Flosy-Direct-Capture-Lab-v3.5.0.apk
          for APK in "$STANDARD" "$SMS"; do
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -8
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee /tmp/flosy-permissions.txt
            if grep -Eq 'android.permission.(READ_SMS|RECEIVE_SMS|SEND_SMS|BIND_NOTIFICATION_LISTENER_SERVICE|BIND_ACCESSIBILITY_SERVICE)' /tmp/flosy-permissions.txt; then
              echo "Unsafe declared permission found in $APK"; exit 1
            fi
          done
          # Direct Lab intentionally requests RECEIVE_SMS; Standard and SMS do not.
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$DIRECT" | tee /tmp/direct-permissions.txt
          grep -q 'android.permission.RECEIVE_SMS' /tmp/direct-permissions.txt
          if grep -Eq 'android.permission.(READ_SMS|SEND_SMS|BIND_ACCESSIBILITY_SERVICE)' /tmp/direct-permissions.txt; then
            echo 'Unexpected permission in Direct Lab'; exit 1
          fi
          grep -Fq 'AutoRelayStore.acceptDirect' android/app/src/direct/java/com/flosy/finance/DirectSmsReceiver.java
          grep -Fq 'AutoRelayStore.acceptDirect' android/app/src/direct/java/com/flosy/finance/DirectNotificationListener.java
          ls -lh dist/*.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Flosy-Android-v3.5.0-Direct-Capture-Lab
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish two APKs as GitHub Release
        if: github.ref == 'refs/heads/flosy-android' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="flosy-android-v3.5.0"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/*.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "فلوسي Android v3.5.0 — ReceiptML + VoiceNLU + Safe Automate + Gemini Free" \
              --notes "Flosy Safe Automate v3.5.0: receives authorized bank SMS from the user's Automate flow using an allowlisted sender + pairing token; stores all non-secret allowlisted SMS in an AES-GCM local queue (OTP/PIN/CVV excluded). The latest Flosy website loaded by the APK offers opt-in automatic saving of clearly recognized SMS and Egyptian Arabic spoken transactions, and itemized Arabic/English receipt extraction. Its offline ReceiptML module uses a synthetically trained numerical-line classifier and Tesseract Arabic/English after native Latin ML Kit. VoiceNLU is an offline synthetically trained Egyptian-Arabic intent classifier; the Android speech-to-text service may use the network depending on device. Both synthetic models require real-world testing, no guarantee of reading every receipt. New Flosy AI Gemini API Free mode uses the owner's Supabase function only if GEMINI_ENABLED is true and an unbilled Google AI Studio Free Tier project is configured; it does NOT use Google AI Pro subscription quota. Gemini AI chat currently receives only generic non-identifying labels/rounded ratios, not raw SMS, voice, photos or account data. Gemini-powered parsing of SMS/voice/receipts is not yet enabled. App UI requires internet for current hosted site updates. This is a debug-signed TESTING APK, not a Play-approved production release. GitHub Actions debug signing may differ from earlier APKs: backup and validate cloud sync before updating; NEVER uninstall old app merely to bypass signature conflicts without restoring backup. Do NOT disable Play Protect. Standard and Safe Automate have no restricted SMS permission. The separate Direct Lab APK requests hard-restricted RECEIVE_SMS and notification access via explicit Android consent, so Play/installer may deny SMS. New transactions may be captured directly without Automate if permissions are granted. Debug-only; no historical inbox scan. Incomplete events go to review."
          fi
