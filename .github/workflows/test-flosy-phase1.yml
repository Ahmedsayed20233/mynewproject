name: Flosy Quality Gates — Financial Safety + V4
on:
  push:
    branches: [flosy-site, "fix/**", "feature/**"]
    paths:
      - 'index.html'
      - 'flosy-ultra.html'
      - 'flosy.html'
      - 'flosy-unified*'
      - 'flosy-ai-experience-v396.*'
      - 'tests/v396-ai-browser.cjs'
      - 'flosy-ux-v391.*'
      - 'flosy-categories-v391.js'
      - 'flosy-legacy-theme-v391.css'
      - 'tests/v391.test.cjs'
      - 'flosy-voice-nlu.js'
      - 'flosy-voice-safety-v2.js'
      - 'flosy-nlu-compact-vocab.js'
      - 'flosy-nlu-compact-weights.js'
      - 'flosy-egyptian-nlu-compact-v2.js'
      - 'tests/trained-nlu-compact.test.cjs'
      - 'flosy-capture-review-v2.js'
      - 'flosy-capture-review-v2.css'
      - 'tests/voice-safety-v2.test.cjs'
      - 'flosy-report-pro.*'
      - 'flosy-services-v392.*'
      - 'flosy-screen-map-v395.js'
      - 'tests/screen-consolidation.test.cjs'
      - 'tests/more-menu-consolidation.test.cjs'
      - 'flosy-copilot-v392.js'
      - 'tests/v392.test.cjs'
      - 'flosy-finance-*.js'
      - 'flosy-finance-*.css'
      - 'tests/v393.test.cjs'
      - 'tests/unified.test.cjs'
      - 'flosy-ultra-*'
      - 'tests/ultra.test.cjs tests/unified.test.cjs'
      - 'flosy-sync-v3.js'
      - 'flosy-phase1.js'
      - 'flosy-next.js'
      - 'flosy-automate-relay.js'
      - 'flosy-automate-relay.css'
      - 'flosy-v4-*.js'
      - 'flosy-v4-white.css'
      - 'flosy-v5-pearl.css'
      - 'flosy-v5-command.js'
      - 'flosy-v5-private-backup.js'
      - 'flosy-elevate.js'
      - 'flosy-studio.js'
      - 'flosy-studio.css'
      - 'flosy-aurora.css'
      - 'flosy-aurora.js'
      - 'flosy-capture-v10.css'
      - 'flosy-v5-command.js'
      - 'flosy-v4-family-privacy.js'
      - 'flosy-elevate.css'
      - 'finance-pro.js'
      - 'tests/browser-smoke.cjs'
      - 'flosy-repair.js'
      - 'flosy-assistant-bridge.js'
      - 'flosy-ai.js'
      - 'flosy-account-router.js'
      - 'tests/account-router.test.cjs'
      - 'flosy-report-kit.js'
      - 'tests/aurora.test.cjs'
      - 'supabase/functions/flosy-ai/index.ts'
      - 'service-worker.js'
      - 'tests/v4.test.cjs'
      - 'tests/offline-cache.test.cjs'
      - 'tests/phase1.test.cjs'
      - '.github/workflows/test-flosy-phase1.yml'
  pull_request:
    branches: [flosy-site]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Finance calculation and cloud synchronization tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Show Node version
        run: node --version
      - name: Validate JavaScript modules
        run: |
          node --check flosy-sync-v3.js
          node --check flosy-phase1.js
          node --check flosy-next.js
          node --check flosy-automate-relay.js
          node --check flosy-ai-analytics.js
          node --check flosy-ai.js
          node --check flosy-account-router.js
          node --check flosy-report-kit.js
          node --check flosy-v4-capture.js
          node --check flosy-voice-safety-v2.js
          node --check flosy-nlu-compact-vocab.js
          node --check flosy-nlu-compact-weights.js
          node --check flosy-egyptian-nlu-compact-v2.js
          node --check flosy-capture-review-v2.js
          node --check flosy-v4-bank.js
          node --check flosy-v4-wealth.js
          node --check flosy-v4-family-privacy.js
          node --check flosy-v4-reminders.js
          node --check flosy-v5-command.js
          node --check flosy-v5-private-backup.js
          node --check flosy-elevate.js
          node --check flosy-studio.js
          node --check flosy-aurora.js
          node --check flosy-ultra-data.js
          node --check flosy-ultra-ai.js
          node --check flosy-ultra-live.js
          node --check flosy-ultra-more.js
          node --check flosy-unified-ai.js
          node --check flosy-ai-experience-v396.js
          node --check flosy-unified-pages.js
          node --check flosy-unified.js
          node --check flosy-report-pro.js
          node --check flosy-services-v392.js
          node --check flosy-screen-map-v395.js
          node --check flosy-copilot-v392.js
          node --check flosy-finance-engine-v393.js
          node --check flosy-finance-ui-v393.js
          node --check flosy-categories-v391.js
          node --check flosy-ux-v391.js
          node --check flosy-repair.js
          node --check flosy-assistant-bridge.js
          node --check service-worker.js
      - name: Run financial safety regression suite
        run: node --test tests/more-menu-consolidation.test.cjs tests/screen-consolidation.test.cjs tests/trained-nlu-compact.test.cjs tests/voice-safety-v2.test.cjs tests/phase1.test.cjs tests/v4.test.cjs tests/offline-cache.test.cjs tests/direct-capture-ui.test.cjs tests/ai-analytics.test.cjs tests/report-kit.test.cjs tests/aurora.test.cjs tests/ultra.test.cjs tests/unified.test.cjs tests/v391.test.cjs tests/v392.test.cjs tests/v393.test.cjs tests/report-kit.test.cjs
