plugins {
    id 'com.android.application'
}

android {
    namespace 'com.flosy.finance'
    compileSdk 35

    defaultConfig {
        applicationId 'com.flosy.finance'
        minSdk 24
        targetSdk 35
        versionCode 7
        versionName '2.1.0'
    }


    flavorDimensions 'permissionLevel'
    productFlavors {
        standard {
            dimension 'permissionLevel'
            // Unrestricted install; SMS can still be shared manually via ACTION_SEND.
        }
        sms {
            dimension 'permissionLevel'
            applicationIdSuffix '.sms'
            // Explicit user-initiated Android READ_SMS scan, sideloaded test only.
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
