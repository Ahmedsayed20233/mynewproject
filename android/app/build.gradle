plugins {
    id 'com.android.application'
}

dependencies {
    // Bundled on-device Latin text recognition; does not upload receipt images.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.webkit:webkit:1.13.0'
    // AndroidX transitive dependencies need aligned Kotlin JDK bridges (avoid duplicate classes).
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
}


android {
    namespace 'com.flosy.finance'
    compileSdk 35

    defaultConfig {
        applicationId 'com.flosy.finance'
        minSdk 24
        targetSdk 35
        versionCode 37
        versionName '3.6.0'
    }


    buildFeatures { buildConfig true }

    flavorDimensions 'permissionLevel'
    productFlavors {
        standard {
            dimension 'permissionLevel'
            // No restricted SMS/notification permissions; accepts user-selected ACTION_SEND text.
        }
        sms {
            dimension 'permissionLevel'
            applicationIdSuffix '.sms'
            // Safe Import variant supports only share/paste and CSV, with no restricted SMS permissions.
        }
        direct {
            dimension 'permissionLevel'
            applicationIdSuffix '.direct'
            // Experimental user-opt-in capture: hard-restricted RECEIVE_SMS may be denied.
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
