plugins {
    id 'com.android.application'
}

dependencies {
    // Bundled on-device Latin text recognition; does not upload receipt images.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}


android {
    namespace 'com.flosy.finance'
    compileSdk 35

    defaultConfig {
        applicationId 'com.flosy.finance'
        minSdk 24
        targetSdk 35
        versionCode 9
        versionName '2.4.0'
    }


    buildFeatures { buildConfig true }

    flavorDimensions 'permissionLevel'
    productFlavors {
        standard {
            dimension 'permissionLevel'
            // Unrestricted install; SMS can still be shared manually via ACTION_SEND.
        }
        sms {
            dimension 'permissionLevel'
            applicationIdSuffix '.sms'
            // Explicit user-initiated Android READ_SMS scan, sideloaded test only.
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
